<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="data:,"></head><body><title>Index</title>
<style>
/* S01 / System One, with lessons from Fragment's product: the data is the illustration, search results are the UI,
   and every motion reads as the index at work (paths resolving, digits rolling, values looked up).
   Layout: one shell. Its foot is the bar (Index, Search, Outreach as separate pills); everything else (the index,
   suggestions, outreach, the selection) grows up out of it as one accordion. It starts alone in the centre; once there
   is something to look for, the index opens and pushes the bar to the bottom of the screen. */
:root {
  --text: #111; --muted: #8c8c8c; --faint: #c6c6c6; --rule: #e2e2e2;
  --page: #fff; --well: #f4f4f4; --card: #fff;
  --ok: #1fbf5f; --busy: #f5a524; --error: #ef4444;
  --lh: 20px; --s: 5px; --u: 10px; /* spacing: 5px inside text-level items (pills, rows, label to value); 10px for panel padding and every gap; 20px only between page sections */ --ctl: var(--s) var(--u); /* every pill control: 5px top/bottom, 10px sides = 30px tall. A round badge leading a pill sits 5px from top, bottom and start. Containers of controls pad 5px, gap 5px. */ --r-panel: 22px; --r-card: 18px; --r-box: 12px;
  --font: "ABC Areal Superfamily Variable", "ABC Areal", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: "ABC Areal Superfamily Variable", "ABC Areal", ui-monospace, "SF Mono", Menlo, monospace;
  --ease: cubic-bezier(.4, 0, .2, 1);
  --drkm: 0;
}
@media (prefers-color-scheme: dark) { :root {
  --text: #ececec; --muted: #858585; --faint: #4b4b4b; --rule: #2a2a2a; --page: #0b0b0b; --well: #161616; --card: #1f1f1f; --drkm: 100; color-scheme: dark; } }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
/* No grey tap flash on mobile WebKit; controls show their own hover and press states. No double-tap zoom delay on controls. */
button, a, label, input, .item-head, .hit { touch-action: manipulation; }
[hidden] { display: none !important; }
html, body { font-size: 14px; line-height: var(--lh); } /* 14px is the floor: nothing on the page is set smaller. */
/* iPhone Safari zooms into any field under 16px when it is focused; on touch screens fields are set at 16px so it never does. */
@media (pointer: coarse) { input, textarea, select { font-size: 16px !important; } }
body { background: var(--page); color: var(--text); font-family: var(--font); font-weight: 400; font-variation-settings: "MONO" 0, "DRKM" var(--drkm); -webkit-font-smoothing: antialiased; }
h1, h2, h3, p, dl, dd, ul { margin: 0; font-size: inherit; font-weight: 400; }
button, input { font: inherit; color: inherit; }
/* Type split: data is set in the system mono, the interface (labels, headings, controls, prose) in plain text at 400 to 550. */
.mono, .kv > span:last-child, .stats div > span:last-child, .tree .nm, .tree .num, .hit .leaf, .hit .n, #count, .prov { font-family: var(--mono); font-variation-settings: "MONO" 100, "DRKM" var(--drkm); font-variant-numeric: tabular-nums; }
.kv > span:last-child .prov { font-family: var(--font); font-variation-settings: "MONO" 0, "DRKM" var(--drkm); }
.mono { font-family: var(--mono); font-variation-settings: "MONO" 100, "DRKM" var(--drkm); font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; text-align: right; }
.muted { color: var(--muted); }
.trunc { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.label { text-transform: uppercase; color: var(--muted); padding-bottom: var(--s); border-bottom: 1px solid var(--rule); }
:focus-visible { outline: 1px solid var(--text); outline-offset: 2px; }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none; background: var(--faint); vertical-align: middle; }
.dot.ok { background: var(--ok); } .dot.busy { background: var(--busy); } .dot.error { background: var(--error); }

a, button { transition: color .15s var(--ease), background-color .15s var(--ease); }
@keyframes reveal { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }


/* controls */
.btn { background: var(--well); border: 0; border-radius: 999px; padding: var(--ctl); cursor: pointer; display: inline-flex; gap: var(--s); align-items: center; white-space: nowrap; }
.btn:hover { color: var(--muted); }
.btn[disabled] { color: var(--faint); cursor: default; }
.kbd { color: var(--muted); }
@media (pointer: coarse), (max-width: 560px) { .kbd { display: none; } } /* no shortcut hint on phones, where the field needs the room */
.card { background: var(--card); border-radius: var(--r-card); padding: var(--u); display: grid; gap: var(--u); min-width: 0; align-content: start; }
.card > .cap { display: flex; justify-content: space-between; gap: var(--u); }
.segs { display: flex; flex-wrap: wrap; gap: var(--s); background: var(--well); border-radius: 999px; padding: var(--s); width: fit-content; max-width: 100%; }
.seg { background: none; border: 0; border-radius: 999px; padding: 0 var(--u); cursor: pointer; color: var(--muted); white-space: nowrap; }
.seg:hover { color: var(--text); }
.seg[aria-pressed="true"] { background: var(--card); color: var(--text); }
.seg .n { line-height: 1; color: var(--muted); font-family: var(--mono); font-variation-settings: "MONO" 100; }
/* Tabs: the active segment is one pill that slides between segments; tabs never wrap, they scroll sideways. */
.segs.tabs { position: relative; flex-wrap: nowrap; width: 100%; overflow-x: auto; scrollbar-width: none; }
.segs.tabs::-webkit-scrollbar { display: none; }
.segs.tabs .seg { position: relative; z-index: 1; flex: 1 1 auto; text-align: center; padding: 0 var(--s); transition: color .25s var(--ease); }
.segs.tabs .seg[aria-pressed="true"] { background: none; }
.tab-ind { position: absolute; left: 0; top: var(--s); height: var(--lh); border-radius: 999px; background: var(--card); transition: transform .3s var(--ease), width .3s var(--ease); pointer-events: none; }
#tabpanel { display: grid; gap: var(--lh); min-width: 0; }

/* The shell: one card that holds everything, with a 1px rule. The bar is its foot. Above the bar, in order: the selection,
   the suggestions, and the stage (the index or outreach). Each one opens by growing its height, so the whole shell moves
   like one accordion: when suggestions grow, the stage gives up the same room at the same speed. */
:root { --float: .7s; --ease-out: cubic-bezier(.16, 1, .3, 1); --glide: .45s; --edge: calc(var(--u) * 2); }
@media (max-width: 560px) { :root { --edge: var(--u); } }
html, body { overflow: hidden; height: 100%; margin: 0; }
.shell { --slide: .5s; position: fixed; z-index: 9; left: 0; right: 0; bottom: calc(var(--edge) + env(safe-area-inset-bottom, 0px)); margin: 0 auto; width: min(1040px, calc(100% - var(--u) * 2)); display: flex; flex-direction: column; padding: var(--s); border-radius: var(--r-panel); background: var(--card); outline: 1px solid var(--rule); outline-offset: -1px; transition: transform var(--slide) cubic-bezier(.65, 0, .35, 1), width var(--slide) cubic-bezier(.65, 0, .35, 1); }

/* The stage: the index or outreach. Its height is set in fitStage(): its content, up to what the screen has left. */
.stage { height: 0; overflow: hidden; border-bottom: 0 solid var(--rule); transition: margin .3s var(--ease); }
.shell.open .stage { border-bottom-width: 1px; margin-bottom: var(--s); }
.stage.glide { transition: height .55s var(--ease-out), margin var(--glide) var(--ease-out); }
.stage-in { height: 100%; overflow-y: auto; overscroll-behavior: contain; padding: 0 var(--s); scrollbar-width: thin; scrollbar-color: var(--faint) transparent; }
.view { display: grid; gap: var(--u); padding-bottom: var(--u); min-width: 0; }
/* A view's heading and controls stay pinned while its rows scroll under them. */
.view-head { position: sticky; top: 0; z-index: 2; display: grid; gap: var(--u); padding-top: var(--u); background: var(--card); }
.view-head > .cap { display: flex; justify-content: space-between; gap: var(--u); }

/* The bar: three separate pills, Index, Search and Outreach, in one strip. */
.bar { display: flex; gap: var(--s); align-items: center; min-width: 0; }
.bar .logo { font-weight: 550; }
.bar .btn[aria-pressed="true"] { background: var(--text); color: var(--page); }
.bar .btn[aria-pressed="true"]:hover { color: var(--page); opacity: .85; }
@media (max-width: 560px) { #outbtn .lbl { display: none; } #outbtn { width: 30px; height: 30px; padding: 0; justify-content: center; } }
/* The field is a grey pill. Tags are 20px pills inside it, and only the tags scroll, so the search icon stays put. */
.field { flex: 1; min-width: 12ch; display: flex; align-items: center; gap: var(--s); background: var(--well); border-radius: 999px; padding: var(--ctl); cursor: text; overflow: hidden; }
.field .i { color: var(--muted); }
.field input { flex: 1; min-width: 6ch; border: 0; background: none; outline: none; padding: 0; font: inherit; color: inherit; caret-color: var(--text); }
.field input::placeholder { color: var(--muted); transition: color .2s var(--ease); }
.field:focus-within { outline: 1px solid var(--text); outline-offset: -1px; }
.field:focus-within input::placeholder { color: var(--faint); }
.field:focus-within .kbd, .field.has .kbd { display: none; }
.tags { display: flex; gap: var(--s); flex: 0 1 auto; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.tags::-webkit-scrollbar { display: none; }
.tags:empty { display: none; }
.tags.clipped { -webkit-mask-image: linear-gradient(to right, transparent, #000 15px); mask-image: linear-gradient(to right, transparent, #000 15px); }
.tag-chip { display: inline-flex; align-items: center; gap: var(--s); height: 20px; padding: 0 7px 0 5px; border: 0; border-radius: 999px; background: var(--card); color: var(--text); font: inherit; white-space: nowrap; cursor: pointer; flex: none; } /* 7px after the text balances the icon's own 2px of air before it */
.tag-chip:has(> .dot) { padding-left: 7px; }
.tag-chip .ti, .hit .ti { color: var(--muted); display: block; }
.tag-chip .x { display: none; }
.tag-chip:not(.ghost):hover > .ti, .tag-chip:not(.ghost):hover > .dot, .tag-chip.sel > .ti, .tag-chip.sel > .dot { display: none; }
.tag-chip:not(.ghost):hover > .x, .tag-chip.sel > .x { display: block; }
.tag-chip.sel { outline: 1px solid var(--text); outline-offset: -1px; }
.tag-chip.ghost { background: none; outline: 1px solid var(--rule); outline-offset: -1px; cursor: inherit; }
@media (prefers-reduced-motion: no-preference) { .tag-chip.born { animation: born .3s var(--ease-out) both; } @keyframes born { from { opacity: 0; transform: scale(.85); } } }
.hit .chips { display: inline-flex; gap: var(--s); align-items: center; min-width: 0; overflow: hidden; }

/* Suggestions: only while you type. The tray's height follows its content (set in renderTray). */
.tray { height: 0; overflow: hidden; transition: height var(--glide) var(--ease-out); }
#segs { display: flex; flex-direction: column-reverse; flex-wrap: nowrap; width: 100%; max-width: none; max-height: 40vh; overflow-y: auto; background: none; border-radius: var(--r-card); padding: 0 0 var(--s); gap: 0; }
#segs .hit { width: 100%; }

/* The selection: picked businesses and what to do with them, one row above the bar. */
.selrow { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--glide) var(--ease-out); }
.selrow.open { grid-template-rows: 1fr; }
.selrow-in { overflow: hidden; min-height: 0; }
.selrow-box { display: grid; gap: var(--s); padding-bottom: var(--s); }
.selrow .acts { gap: var(--s); flex-wrap: nowrap; }
.selrow .cnt { padding: var(--ctl); white-space: nowrap; margin-right: auto; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
@media (max-width: 480px) { .selrow .wide { display: none; } #sel-add { text-transform: capitalize; } }
.selrow .segs { border-radius: var(--r-card); width: 100%; }
.selrow .seg { padding: var(--ctl); }
.selrow .seg:hover { background: var(--card); color: var(--text); }
#biz .cap, #outreach .cap { min-width: 0; }

/* List: every business is one 30px row, grouped by city in location order.
   Hover fills the row grey; opening it grows that grey into a panel holding the full record. */
.toolbar { display: flex; align-items: center; gap: var(--s); flex-wrap: wrap; }
.toolbar .order { color: var(--muted); margin-left: auto; padding-inline: var(--s); white-space: nowrap; }
.toolbar .order:not(:empty) + #sort { margin-left: 0; }
#mode, #sort { width: auto; flex: none; }
#sort { margin-left: auto; }
/* Icons: Lucide (ISC). 16px, stroke 1.5 on its 24px grid, which draws the S01 1px line. Colour follows the text. */
.i { width: 16px; height: 16px; flex: none; display: block; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.btn.icon { width: 30px; height: 30px; padding: 0; justify-content: center; }
.segs .seg.icon { display: inline-grid; place-items: center; height: 20px; padding: 0 7px; flex: none; }
.list { display: grid; }
/* Rows and city headings out of view skip layout and paint, so opening a row stays smooth with thousands in the list. */
.list > .item:not(.open), .list > .grp { content-visibility: auto; contain-intrinsic-size: auto 30px; }
#biz .lhead, #biz .item-head { display: grid; grid-template-columns: minmax(0, 1fr) 18% 20% 7ch 7px; gap: var(--u); align-items: baseline; }
#biz.nokm .lhead, #biz.nokm .item-head { grid-template-columns: minmax(0, 1fr) 18% 20% 7px; }
#biz.nokm .km { display: none; }
@media (max-width: 600px) { .c-hide { display: none; } }
@media (max-width: 600px) {
  #biz .lhead, #biz .item-head { grid-template-columns: minmax(0, 1fr) 7ch 7px; }
  #biz.nokm .lhead, #biz.nokm .item-head { grid-template-columns: minmax(0, 1fr) 7px; }
}
.lhead { color: var(--muted); padding: 0 var(--u) var(--s); border-bottom: 1px solid var(--rule); }
.lhead .num, .item-head .num { text-align: right; }
.grp { display: flex; justify-content: space-between; gap: var(--u); color: var(--muted); padding: var(--s) var(--u); margin-top: var(--s); border-top: 1px solid var(--rule); }
.grp:first-child { margin-top: 0; border-top: 0; }
.item { border-radius: 15px; transition: background-color .15s var(--ease), border-radius .35s var(--ease), margin .35s var(--ease), box-shadow .15s var(--ease); }
.item-head { width: 100%; height: 30px; background: none; border: 0; border-radius: 15px; text-align: left; cursor: pointer; padding: var(--ctl); transition: padding .35s var(--ease), height .35s var(--ease); }
.item-head > * { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item-head .dot { justify-self: end; align-self: center; }
.item-head:focus-visible { outline-offset: -1px; }
.nm { font-family: var(--mono); font-variation-settings: "MONO" 100, "DRKM" var(--drkm); }
.item:hover, .item.picked, .item.open { background: var(--well); }
/* Selected rows that touch join into one block, like highlighted text. */
.item.picked:not(.open):has(+ .item.picked:not(.open)) { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
.item.picked:not(.open) + .item.picked:not(.open) { border-top-left-radius: 0; border-top-right-radius: 0; }
.item.picked .nm, .item.open .nm { font-weight: 500; }
#biz.selecting .item:not(.picked):hover { background: none; box-shadow: inset 0 0 0 1px var(--rule); }
/* Open: the grey reaches 5px past the row on every side and its corners relax to the panel radius, while the text stays put. */
.item.open { border-radius: var(--r-panel); margin: var(--s) calc(var(--s) * -1); }
.item.open .item-head { height: 40px; padding: var(--u) calc(var(--u) + var(--s)); } /* text sits 15px from the panel's top and its start: even on both sides */
.item-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .35s var(--ease); }
.item.open .item-body { grid-template-rows: 1fr; }
.item-body > div { overflow: hidden; min-height: 0; }
.item .sheet { margin: 0 var(--s) var(--s); border-radius: calc(var(--r-panel) - var(--s)); }
.instant, .instant * { transition: none !important; }
@media (prefers-reduced-motion: no-preference) { .item.new { animation: reveal .3s ease-out both; animation-delay: calc(var(--i, 0) * 25ms); } }
.empty { padding: var(--s) var(--u); }
.rec-top { display: flex; justify-content: space-between; align-items: center; gap: var(--u); flex-wrap: wrap; }
.rec-top > .lead { flex: 1 1 160px; } /* the status is a pill like the buttons, so both top corners sit 10px in */
.pill { background: var(--well); border-radius: 999px; padding: var(--ctl); height: 30px; color: var(--muted); }
/* A status dot leading text: centred on the line, 5px from the word. */
.lead { display: inline-flex; align-items: center; gap: var(--s); min-width: 0; }
.lead > .trunc { min-width: 0; }
.rec-top .acts { gap: var(--s); flex-wrap: nowrap; }

.reels { display: inline-flex; vertical-align: top; }
.reel { display: inline-block; height: var(--lh); overflow: hidden; }
.reel > span { display: flex; flex-direction: column; transition: transform .5s var(--ease); }
.reel > span > span { height: var(--lh); line-height: var(--lh); }
@media (prefers-reduced-motion: reduce) { .reel > span { transition: none; } }
.prov { background: var(--card); border-radius: 999px; padding: 0 var(--s); color: var(--muted); white-space: nowrap; margin-left: var(--s); }
.form .r.walk { filter: blur(2px); opacity: .35; }
.form .r.lit { filter: none; opacity: 1; transition: filter .3s ease-out, opacity .3s ease-out; }
.form .r { position: relative; }
/* record */
.recname { display: grid; }
.form { display: grid; gap: var(--s); }
.form .rows { background: var(--well); border-radius: var(--r-box); overflow: hidden; }
.form .r { display: grid; grid-template-columns: minmax(0, 1fr) auto; border-bottom: 1px solid var(--card); min-height: var(--lh); align-items: center; }
.form .r:last-child { border-bottom: 0; }
.form .r > span { padding: var(--s) var(--u); min-width: 0; overflow-wrap: anywhere; }
.form .r .act { padding: 0 var(--s); }
.form .r .act button { background: var(--card); border: 0; border-radius: 999px; padding: 0 var(--u); cursor: pointer; color: var(--muted); }
.form .r .act button:hover { color: var(--text); }
.kv { display: grid; grid-template-columns: 11ch minmax(0, 1fr); gap: var(--u); }
.kv .k { color: var(--muted); }
/* Bento: one grey box split by 1px lines in the card colour, the same construction as the fact rows below it */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--card); border-radius: var(--r-box); overflow: hidden; }
.stats div { display: grid; background: var(--well); padding: var(--s) var(--u); min-width: 0; }
.tree { display: grid; }
.tree button { display: grid; grid-template-columns: 2ch minmax(0, 1fr) auto; gap: var(--s); background: none; border: 0; padding: var(--s) 0; text-align: left; cursor: pointer; }
.tree button:hover .nm { color: var(--muted); }
.json { margin: 0; overflow-x: auto; max-height: 320px; white-space: pre; color: var(--muted); background: var(--well); border-radius: var(--r-box); padding: var(--u); }
.json b { font-weight: 400; color: var(--text); }
a.ext { color: var(--muted); text-decoration: none; justify-self: start; background: var(--well); border-radius: 999px; padding: var(--ctl); }
a.ext:hover { color: var(--text); }

/* settings */
.fields { display: grid; gap: var(--u); }
.acts { display: flex; gap: var(--u); flex-wrap: wrap; align-items: center; }

/* suggestion rows: paths resolve left to right, state to city to the business */
.hit { display: flex; gap: var(--s); align-items: center; padding: var(--ctl); border-radius: 999px; cursor: pointer; white-space: nowrap; overflow: hidden; }
.hit .p { color: var(--muted); }
.hit .sep { color: var(--faint); }
.hit .leaf { overflow: hidden; text-overflow: ellipsis; }
.hit .n { color: var(--muted); margin-left: auto; padding-left: var(--u); }
.hit[aria-selected="true"] { background: var(--well); }
.hit[aria-selected="true"] .leaf { font-weight: 500; }
.hit .pi, .hit .sep { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.hit .sep { flex-shrink: 0; }
.hit .pi:has(.leaf) { flex-shrink: 0; max-width: 75%; }
@media (prefers-reduced-motion: no-preference) { .hit .pi { animation: resolve .25s ease-out both; } @keyframes resolve { from { opacity: 0; transform: translateX(-3px); filter: blur(2px); } to { opacity: 1; transform: none; } } }

/* outreach: bulk select, groups, contact log, campaigns */
.nmw { display: flex; align-items: baseline; min-width: 0; }
.nmw .tag { flex: none; }
.tag { display: inline-block; background: var(--well); border-radius: 999px; padding: 0 var(--s); margin-left: var(--s); color: var(--muted); font-family: var(--font); font-variation-settings: "MONO" 0, "DRKM" var(--drkm); }
.plain, .kv > span.plain { font-family: var(--font); font-variation-settings: "MONO" 0, "DRKM" var(--drkm); }
.newg { display: inline-flex; gap: var(--s); align-items: center; background: var(--well); border-radius: 999px; padding-left: var(--u); }
.plain-in { background: none; border: 0; padding: 0; min-width: 0; outline: none; font: inherit; color: inherit; width: 100%; }
.plain-in::placeholder { color: var(--faint); }
.field-row { display: grid; grid-template-columns: 11ch minmax(0, 1fr); align-items: center; gap: var(--u); background: var(--well); border-radius: var(--r-box); padding: var(--s) var(--u); }
.area { width: 100%; resize: vertical; background: var(--well); border: 0; border-radius: var(--r-box); padding: var(--s) var(--u); font: inherit; color: inherit; outline: none; line-height: var(--lh); }
.area:focus-visible, .field-row:focus-within { outline: 1px solid var(--text); outline-offset: -1px; }
.segs.chips { border-radius: var(--r-card); width: 100%; background: var(--well); }
.segs.chips .seg { padding: var(--ctl); }
.segs.chips .seg[aria-pressed="true"] { background: var(--card); color: var(--text); }
.stats.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 480px) { .stats.four { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.meter { height: 2px; background: var(--rule); border-radius: 2px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--text); transition: width .3s var(--ease); }

<script>
/* ===================================================================
   IndexCore: the reusable part. No DOM code in here.
   Any app (restaurant app, company search, an API server) can use it:
     const core = IndexCore.create();
     core.addProvider(IndexCore.providers.static(records));
     const { items, facets } = await core.search({ text, filters, near });
   =================================================================== */
const IndexCore = (() => {
  // One record shape for every business, whatever the source.
  const ENTITY_FIELDS = ["id","name","legalName","description","sector","naics","status","entityType","entityNumber",
    "formed","employees","revenueBand","address","city","county","state","zip","lat","lng","phone","website","email",
    "hours","owners","tags","sources","updated","sectorBy","sectorP"];

  function normalize(raw, sourceName) {
    const e = {};
    for (const k of ENTITY_FIELDS) e[k] = raw[k] ?? null;
    e.id = e.id || `${sourceName}:${(e.entityNumber || e.name || Math.random()).toString().toLowerCase()}`;
    e.tags = Array.isArray(e.tags) ? e.tags : [];
    e.sources = e.sources && e.sources.length ? e.sources : [{ name: sourceName, fetched: new Date().toISOString().slice(0,10) }];
    e.status = (e.status || "unknown").toLowerCase();
    e.state = e.state || "CA";
    // Provenance: which source supplied each field, so every value in the one true record can say where it came from.
    const src = e.sources[0].name;
    e.provenance = {};
    for (const k of ENTITY_FIELDS) if (raw[k] != null && raw[k] !== "" && !(Array.isArray(raw[k]) && !raw[k].length)) e.provenance[k] = src;
    return e;
  }

  const tokenize = s => (s || "").toLowerCase().normalize("NFKD").replace(/[^\w\s-]/g, " ").split(/\s+/).filter(Boolean);

  function score(e, terms) {
    if (!terms.length) return 1;
    const fields = [[e.name,5],[e.legalName,4],[e.entityNumber,6],[e.sector,3],[e.entityType,3],[e.city,3],[e.tags.join(" "),2],[e.description,1],[e.naics,3]];
    let total = 0;
    for (const t of terms) {
      let best = 0;
      for (const [v, w] of fields) {
        const toks = tokenize(v);
        if (toks.includes(t)) best = Math.max(best, w);
        else if (toks.some(x => x.startsWith(t))) best = Math.max(best, w * 0.6);
        else if (t.length >= 4 && toks.some(x => near1(x, t))) best = Math.max(best, w * 0.4); // one typo allowed
        else if (t.length > 5 && toks.some(x => x.startsWith(t.slice(0, -2)))) best = Math.max(best, w * 0.4); // same stem: surgeon, surgery
      }
      if (!best) return 0; // every term must match somewhere
      total += best;
    }
    return total;
  }

  // True when a and b differ by at most one edit (typo tolerance for words of 4+ letters).
  function near1(a, b) {
    if (Math.abs(a.length - b.length) > 1) return false;
    let i = 0, j = 0, edits = 0;
    while (i < a.length && j < b.length) {
      if (a[i] === b[j]) { i++; j++; continue; }
      if (++edits > 1) return false;
      if (a.length > b.length) i++; else if (b.length > a.length) j++; else { i++; j++; }
    }
    return edits + (a.length - i) + (b.length - j) <= 1;
  }
  function km(a, b) {
    const R = 6371, r = d => d * Math.PI / 180;
    const dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng);
    const h = Math.sin(dLat/2)**2 + Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLng/2)**2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }

  // Merge records that describe the same business (same entity number, or same name + zip).
  // Same entity number, same name and zip, or (with no zip) same name within about 100 m. Chains stay separate.
  function mergeKey(e) { return e.entityNumber ? `n:${e.entityNumber}` : e.zip ? `k:${tokenize(e.name).join("")}:${e.zip}` : e.lat != null ? `g:${tokenize(e.name).join("")}:${e.lat.toFixed(3)},${e.lng.toFixed(3)}` : `i:${e.id}`; }
  function merge(a, b) {
    const out = { ...a, provenance: { ...a.provenance } };
    for (const k of ENTITY_FIELDS) if ((out[k] == null || out[k] === "") && b[k] != null && b[k] !== "") { out[k] = b[k]; if (b.provenance[k]) out.provenance[k] = b.provenance[k]; }
    const extra = (b.tags || []).filter(t => !(a.tags || []).includes(t));
    out.tags = [...(a.tags || []), ...extra];
    if (extra.length && b.provenance.tags) out.provenance.tags = `${a.provenance.tags || "?"} + ${b.provenance.tags}`;
    out.sources = [...a.sources, ...b.sources];
    return out;
  }

  function facetCounts(items, key) {
    const m = new Map();
    for (const e of items) if (e[key]) m.set(e[key], (m.get(e[key]) || 0) + 1);
    return [...m.entries()].sort((a, b) => b[1] - a[1]);
  }

  function create() {
    const providers = [], normalized = new WeakMap(); // each source record is normalized once, then reused by every search
    return {
      addProvider(p) { providers.push(p); return this; },
      removeProvider(name) { const i = providers.findIndex(p => p.name === name); if (i >= 0) providers.splice(i, 1); },
      get providers() { return providers.map(p => p.name); },
      // filters: { key: value | [values] } (a list matches any of its values); where: an extra predicate from the host app.
      // has / missing: contact fields a remote source can check before it answers, so its limit isn't spent on rows the page drops.
      async search({ text = "", filters = {}, near = null, radiusKm = null, where = null, limit = 50, sort = "relevance", has = [], missing = [] } = {}) {
        const errors = [], metas = [];
        const batches = await Promise.all(providers.map(p =>
          p.search({ text, filters, near, radiusKm, limit, sort, has, missing }).then(rs => { if (rs.meta) metas.push(rs.meta); return rs.map(r => { let e = normalized.get(r); if (!e) normalized.set(r, e = normalize(r, p.name)); return e; }); })
           .catch(err => { errors.push({ provider: p.name, message: err.message }); return []; })));
        const byKey = new Map();
        for (const e of batches.flat()) { const k = mergeKey(e); byKey.set(k, byKey.has(k) ? merge(byKey.get(k), e) : e); }
        const terms = tokenize(text);
        let items = [...byKey.values()].map(e => ({ e, s: score(e, terms) })).filter(x => x.s > 0);
        const all = items.map(x => x.e);
        for (const [k, v] of Object.entries(filters)) if (Array.isArray(v) ? v.length : v) items = items.filter(x => Array.isArray(v) ? v.includes(x.e[k]) : x.e[k] === v);
        if (where) items = items.filter(x => where(x.e));
        if (near) {
          // Distances belong to this search, so they go on copies and the shared records stay untouched.
          items = items.map(x => ({ s: x.s, e: x.e.lat != null ? { ...x.e, distanceKm: km(near, x.e) } : x.e }));
          if (radiusKm) items = items.filter(x => x.e.distanceKm != null && x.e.distanceKm <= radiusKm);
        }
        if (sort === "newest") items.sort((a, b) => String(b.e.updated || "").localeCompare(String(a.e.updated || "")));
        else if (sort === "distance") items.sort((a, b) => (a.e.distanceKm ?? Infinity) - (b.e.distanceKm ?? Infinity) || a.e.name.localeCompare(b.e.name));
        else if (sort === "north") items.sort((a, b) => (b.e.lat ?? -Infinity) - (a.e.lat ?? -Infinity) || a.e.name.localeCompare(b.e.name));
        else items.sort((a, b) => b.s - a.s || a.e.name.localeCompare(b.e.name));
        // A remote source sends back only its best rows, so its own count and facets describe the whole match.
        const m = metas.length === 1 && providers.length === 1 ? metas[0] : null;
        return {
          total: m ? (m.total == null ? null : Math.max(items.length, m.total - (m.n - items.length))) : items.length,
          items: items.slice(0, limit).map(x => x.e),
          facets: m?.facets || { sector: facetCounts(all, "sector"), city: facetCounts(all, "city"), status: facetCounts(all, "status") },
          errors,
        };
      },
    };
  }

  const providers = {
    // Records you already hold (a JSON file, a database export, test data).
    static(records, name = "sample") {
      return { name, search: async () => records };
    },
    // A search server (index/server/server.py) holding more records than a page can. It filters and
    // orders on its side and sends back at most `limit` rows, with the full count and facets.
    remote(endpoint, name = "OpenStreetMap", fetchImpl = (...a) => fetch(...a)) {
      const url = endpoint.replace(/\/+$/, "");
      const get = async (path, init) => {
        const res = await fetchImpl(url + path, init);
        if (!res.ok) throw new Error(`Search server answered ${res.status}`);
        return res.json();
      };
      return {
        name, endpoint: url,
        vocab: () => get("/vocab"),
        async search({ text, filters, near, radiusKm, limit, sort, has, missing }) {
          const f = Object.fromEntries(Object.entries(filters || {}).filter(([, v]) => Array.isArray(v) ? v.length : v));
          const r = await get("/search", { method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text, filters: f, near: near && { lat: near.lat, lng: near.lng }, radiusKm, limit, sort, has, missing }) });
          const rows = r.items; rows.meta = { total: r.total, facets: r.facets, n: rows.length }; return rows;
        },
      };
    },
  };

  return { create, providers, normalize, ENTITY_FIELDS };
})();


/* ===================================================================
   IndexOutreach: bulk contact on top of the index. No DOM code in here.
   Groups, a contact log every campaign writes to (so nobody is contacted
   twice by accident), and campaigns run by a pluggable agent + transport:
     const out = IndexOutreach.create({ load, save });
     const plan = out.plan(entities, { skipWithinDays: 30, onlyActive: true });
     await out.run({ name, brief }, entities, { agent, transport, onEvent });
   =================================================================== */
const IndexOutreach = (() => {
  const DAY = 864e5;
  const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

  function create({ load = () => null, save = () => {} } = {}) {
    const state = Object.assign({ groups: [], log: [], campaigns: [] }, load() || {});
    const persist = () => save(state);
    const api = {
      /* groups: saved lists of businesses */
      groups: () => state.groups,
      createGroup(name, ids = []) { const g = { id: uid("g_"), name, ids: [...new Set(ids)], created: new Date().toISOString() }; state.groups.unshift(g); persist(); return g; },
      addToGroup(gid, ids) { const g = state.groups.find(x => x.id === gid); if (g) { g.ids = [...new Set([...g.ids, ...ids])]; persist(); } return g; },
      removeFromGroup(gid, ids) { const g = state.groups.find(x => x.id === gid); if (g) { g.ids = g.ids.filter(i => !ids.includes(i)); persist(); } return g; },
      deleteGroup(gid) { state.groups = state.groups.filter(g => g.id !== gid); persist(); },
      groupsOf: entityId => state.groups.filter(g => g.ids.includes(entityId)),

      /* contact log: every touch, newest first */
      log: () => state.log,
      history: entityId => state.log.filter(x => x.entityId === entityId),
      lastContact(entityId) { return state.log.find(x => x.entityId === entityId && (x.status === "sent" || x.status === "drafted")) || null; },
      record(entry) { const x = { id: uid("c_"), at: new Date().toISOString(), channel: "email", ...entry }; state.log.unshift(x); persist(); return x; },
      campaigns: () => state.campaigns,

      /* who a campaign would reach, and why the rest are skipped */
      plan(entities, { skipWithinDays = 30, onlyActive = true } = {}) {
        const send = [], skip = [];
        for (const e of entities) {
          const last = api.lastContact(e.id);
          if (!e.email) skip.push({ entity: e, reason: "No email on record" });
          else if (onlyActive && ["suspended", "dissolved"].includes(e.status)) skip.push({ entity: e, reason: `Registration ${e.status}` });
          else if (skipWithinDays && last && Date.now() - new Date(last.at) < skipWithinDays * DAY) skip.push({ entity: e, reason: `Contacted ${last.at.slice(0, 10)}` });
          else send.push(e);
        }
        return { send, skip };
      },

      /* run a campaign: the agent writes each message, the transport delivers it, every result is logged */
      async run({ name, brief }, entities, { agent, transport, rules, onEvent = () => {}, concurrency = 2, signal } = {}) {
        const campaign = { id: uid("k_"), name: name || "Campaign", brief, agent: agent.name, transport: transport.name, at: new Date().toISOString(), counts: {} };
        state.campaigns.unshift(campaign);
        const { send, skip } = api.plan(entities, rules);
        onEvent({ type: "planned", campaign, send, skip });
        skip.forEach(s => onEvent({ type: "skipped", entity: s.entity, reason: s.reason }));
        const queue = [...send];
        const counts = campaign.counts = { total: send.length, done: 0, sent: 0, drafted: 0, failed: 0, skipped: skip.length };
        async function worker() {
          while (queue.length && !signal?.aborted) {
            const e = queue.shift();
            onEvent({ type: "drafting", entity: e });
            try {
              const msg = await agent.draft(e, brief);
              const res = await transport.send({ to: e.email, subject: msg.subject, body: msg.body, entity: e });
              const entry = api.record({ entityId: e.id, name: e.name, campaignId: campaign.id, campaign: campaign.name, to: e.email, subject: msg.subject, body: msg.body, status: res.status, agent: agent.name });
              counts[res.status]++; onEvent({ type: res.status, entity: e, entry });
            } catch (err) {
              const entry = api.record({ entityId: e.id, name: e.name, campaignId: campaign.id, campaign: campaign.name, to: e.email, status: "failed", error: err.message, agent: agent.name });
              counts.failed++; onEvent({ type: "failed", entity: e, entry, error: err.message });
            }
            counts.done++; onEvent({ type: "progress", counts });
          }
        }
        await Promise.all(Array.from({ length: Math.max(1, concurrency) }, worker));
        persist(); onEvent({ type: "finished", campaign, counts });
        return campaign;
      },
    };
    return api;
  }

  const fill = (tpl, e) => tpl.replace(/\{(\w+)\}/g, (_, k) => k === "owner" ? (e.owners?.[0] || "").replace(/\s*\(.*\)$/, "") || "there" : e[k] ?? "");

  const agents = {
    // Works with no key: fills {name}, {city}, {sector}, {owner} into your brief.
    template({ subject = "Hello from {city}" } = {}) {
      return { name: "Template", async draft(e, brief) { return { subject: fill(subject, e), body: fill(brief, e) }; } };
    },
    // Your own agent on the Claude API. It writes one tailored email per business from the brief and the record.
    claude({ apiKey, model = "claude-opus-5-5", instructions = "", sender = "", sdkUrl = "https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk/+esm" }) {
      let client;
      const schema = { type: "object", properties: { subject: { type: "string" }, body: { type: "string" } }, required: ["subject", "body"], additionalProperties: false };
      return {
        name: "Claude",
        async draft(e, brief) {
          if (!client) { const { default: Anthropic } = await import(sdkUrl); client = new Anthropic({ apiKey, dangerouslyAllowBrowser: true }); }
          const facts = { name: e.name, legalName: e.legalName, sector: e.sector, industry: e.naics, city: e.city, owners: e.owners, tags: e.tags, description: e.description, website: e.website, hours: e.hours };
          const res = await client.beta.messages.create({
            model, max_tokens: 16000,
            betas: ["server-side-fallback-2026-07-01"], fallbacks: "default",
            output_config: { effort: "low", format: { type: "json_schema", schema } },
            system: `You write short, specific outreach emails to small businesses on behalf of ${sender || "the sender"}. Use only the facts given about the business. Plain text, no placeholders, under 150 words.${instructions ? "\n\n" + instructions : ""}`,
            messages: [{ role: "user", content: `Brief:\n${brief}\n\nBusiness record:\n${JSON.stringify(facts, null, 2)}` }],
          });
          if (res.stop_reason === "refusal") throw new Error("Claude declined to write this one");
          const text = res.content.find(b => b.type === "text")?.text;
          if (!text) throw new Error("Claude returned no text");
          return JSON.parse(text);
        },
      };
    },
  };

  const transports = {
    // Keeps every message as a draft in the log. Nothing leaves the browser.
    drafts() { return { name: "Drafts only", async send() { return { status: "drafted" }; } }; },
    // Hands each message to your mail service (Resend, Postmark, a Zapier or Make hook, your own server) as JSON.
    webhook({ url, fetchImpl = (...a) => fetch(...a) }) {
      return {
        name: "Webhook",
        async send({ to, subject, body, entity }) {
          const res = await fetchImpl(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ to, subject, body, entityId: entity.id, name: entity.name }) });
          if (!res.ok) throw new Error(`Mail service answered ${res.status}`);
          return { status: "sent" };
        },
      };
    },
  };

  return { create, agents, transports };
})();

/* ===================================================================
   IndexQuery: plain words in, tags out. No DOM code in here.
   Turns "bakeries in san diego with email, staff > 10, not contacted"
   into tags any app can show, edit and compile into a core search:
     const { tags, rest } = IndexQuery.parse(text, vocab);
     const q = IndexQuery.compile(tags, rest, ctx);  // -> { text, filters, near, radiusKm, where }
   =================================================================== */
const IndexQuery = (() => {
  const escRe = s => s.replace(/[.*+?^${}()|[\]\\&]/g, "\\$&");
  const alt = list => list.length ? [...list].sort((a, b) => b.length - a.length).map(escRe).join("|") : "(?!)";
  const YEAR = new Date().getFullYear();
  const UNIT = "(?:staff|employees?|people|workers|person team|headcount)";
  const FIELD = { email: "email", "e-mail": "email", phone: "phone", number: "phone", website: "website", site: "website", web: "website", hours: "hours" };
  const SECTOR_WORDS = { tech: "Technology", software: "Technology", health: "Healthcare", medical: "Healthcare", food: "Food & Beverage", restaurants: "Food & Beverage", eats: "Food & Beverage", property: "Real Estate", realtors: "Real Estate", shops: "Retail", stores: "Retail", factories: "Manufacturing", salons: "Beauty & Wellness", beauty: "Beauty & Wellness", hotels: "Hospitality", gyms: "Fitness & Recreation", fitness: "Fitness & Recreation", auto: "Automotive", cars: "Automotive", banks: "Finance", lawyers: "Professional Services", trades: "Home Services" };
  const CITY_WORDS = { sf: "San Francisco", la: "Los Angeles", sd: "San Diego", sj: "San Jose", sac: "Sacramento", oak: "Oakland", lb: "Long Beach" };
  // Everyday words for the kinds of place in the records (used only when that kind is in the index).
  const TYPE_WORDS = { coffee: "Cafe", "coffee shop": "Cafe", "coffee shops": "Cafe", cafes: "Cafe", dentists: "Dentist", banks: "Bank", hotels: "Hotel", motels: "Hotel", bars: "Bar", pubs: "Pub", pharmacies: "Pharmacy", gym: "Fitness centre", gyms: "Fitness centre", bakeries: "Bakery", supermarkets: "Supermarket", "grocery stores": "Supermarket", grocery: "Supermarket", "fast food": "Fast food", barbers: "Hairdresser", "hair salons": "Hairdresser", "auto repair": "Car repair", mechanics: "Car repair", "car dealers": "Car", doctors: "Doctors", clinics: "Clinic", "hardware stores": "Hardware", "hardware store": "Hardware" };
  const STATES = { alabama: "AL", arizona: "AZ", arkansas: "AR", california: "CA", colorado: "CO", connecticut: "CT", delaware: "DE", florida: "FL", georgia: "GA", idaho: "ID", illinois: "IL", indiana: "IN", iowa: "IA", kansas: "KS", kentucky: "KY", louisiana: "LA", maine: "ME", maryland: "MD", massachusetts: "MA", michigan: "MI", minnesota: "MN", mississippi: "MS", missouri: "MO", montana: "MT", nebraska: "NE", nevada: "NV", "new hampshire": "NH", "new jersey": "NJ", "new mexico": "NM", "new york state": "NY", "north carolina": "NC", "north dakota": "ND", ohio: "OH", oklahoma: "OK", oregon: "OR", pennsylvania: "PA", "rhode island": "RI", "south carolina": "SC", "south dakota": "SD", tennessee: "TN", texas: "TX", utah: "UT", vermont: "VT", virginia: "VA", "washington state": "WA", "west virginia": "WV", wisconsin: "WI", wyoming: "WY", "district of columbia": "DC" };
  const STATE_NAME = Object.fromEntries(Object.entries(STATES).map(([k, v]) => [v, k.replace(/ state$/, "").replace(/\b\w/g, c => c.toUpperCase())]));
  const STOP = /\b(in|at|around|near|that|are|is|the|a|an|and|or|with|of|for|me|show|find|all|any|businesses|business|companies|company|which|who|have|has)\b/gi;

  // Every tag: { kind, v, label }. Same-kind tags of a list kind are OR'd; everything else is AND'd.
  const T = {
    city: v => ({ kind: "city", v, label: v }),
    state: v => ({ kind: "state", v, label: STATE_NAME[v] || v }),
    sector: v => ({ kind: "sector", v, label: v }),
    status: v => ({ kind: "status", v, label: v[0].toUpperCase() + v.slice(1) }),
    type: v => ({ kind: "type", v, label: v }),
    group: v => ({ kind: "group", v, label: v }),
    staff: (min, max) => ({ kind: "staff", v: [min, max], label: max == null ? `${min}+ staff` : min == null ? `≤ ${max} staff` : min === max ? `${min} staff` : `${min}–${max} staff` }),
    formed: (min, max) => ({ kind: "formed", v: [min, max], label: max == null ? `Since ${min}` : min == null ? `Before ${max + 1}` : min === max ? `Formed ${min}` : `${min}–${max}` }),
    has: f => ({ kind: "has", v: f, label: `Has ${f}` }),
    missing: f => ({ kind: "missing", v: f, label: `No ${f}` }),
    contacted: yes => ({ kind: "contacted", v: yes, label: yes ? "Contacted" : "Not contacted" }),
    near: (place, km) => ({ kind: "near", v: { place, km }, label: `${km == null ? "Near" : `≤ ${Math.round(km * 0.621371)} mi of`} ${place === "me" ? "you" : place}` }),
    phrase: p => ({ kind: "phrase", v: p, label: `“${p}”` }),
    exclude: w => ({ kind: "exclude", v: w, label: `Not ${w}` }),
  };
  const toKm = (n, unit) => /^k/i.test(unit) ? +n : +n / 0.621371;

  function parse(input, vocab = {}) {
    let s = " " + input.replace(/\s+/g, " ") + " ";
    const tags = [];
    const take = (re, make) => { s = s.replace(re, (...m) => { const t = make(...m); if (!t) return m[0]; [].concat(t).forEach(x => tags.push(x)); return " "; }); };
    const cities = alt([...(vocab.city || []), ...Object.keys(CITY_WORDS)].filter(Boolean));
    const cityOf = c => CITY_WORDS[c.toLowerCase()] || (vocab.city || []).find(x => x.toLowerCase() === c.toLowerCase()) || c;
    take(/"([^"]+)"/g, (_, p) => T.phrase(p.trim()));
    take(/\s-([a-z][\w'&-]*)(?=\s)/gi, (_, w) => T.exclude(w));
    take(new RegExp(`\\s(?:within|under|inside)\\s+(\\d+(?:\\.\\d+)?)\\s*(mi|miles?|km|kilometers?)\\s+(?:of|from|around)\\s+(me|here|${cities})(?=\\s)`, "gi"), (_, n, u, c) => T.near(/^(me|here)$/i.test(c) ? "me" : cityOf(c), toKm(n, u)));
    take(/\s(?:near|around|close to)\s+(?:me|here)(?=\s)/gi, () => T.near("me", 40));
    take(/\s(?:within|under)\s+(\d+(?:\.\d+)?)\s*(mi|miles?|km)(?=\s)/gi, (_, n, u) => T.near("me", toKm(n, u)));
    // staff: "staff > 20", "staff:10-50", "more than 20 employees", "under 10 staff", "10-50 people", "20+ staff", "small"
    take(/\s(?:staff|employees|headcount)\s*(>=|<=|>|<|=|:)\s*(\d+)(?:\s*-\s*(\d+))?(?=\s)/gi, (_, op, a, b) => b ? T.staff(+a, +b) : op === ">" ? T.staff(+a + 1) : op === ">=" ? T.staff(+a) : op === "<" ? T.staff(null, +a - 1) : op === "<=" ? T.staff(null, +a) : T.staff(+a, +a));
    take(new RegExp(`\\s(more than|over|at least|above)\\s+(\\d+)\\s*${UNIT}(?=\\s)`, "gi"), (_, w, n) => T.staff(/least/i.test(w) ? +n : +n + 1));
    take(new RegExp(`\\s(fewer than|less than|under|at most|below)\\s+(\\d+)\\s*${UNIT}(?=\\s)`, "gi"), (_, w, n) => T.staff(null, /most/i.test(w) ? +n : +n - 1));
    take(new RegExp(`\\s(\\d+)\\s*(?:-|to)\\s*(\\d+)\\s*${UNIT}(?=\\s)`, "gi"), (_, a, b) => T.staff(+a, +b));
    take(new RegExp(`\\s(\\d+)\\+\\s*${UNIT}?(?=\\s)`, "gi"), (_, n) => T.staff(+n));
    take(/\s(?:solo|one[- ]person)(?=\s)/gi, () => T.staff(null, 1));
    // formed: "formed < 2015", "founded before 2015", "since 2018", "in 2019", "older than 10 years", "under 5 years old", "new"
    take(/\s(?:formed|founded|year)\s*(>=|<=|>|<|=|:)\s*(\d{4})(?:\s*-\s*(\d{4}))?(?=\s)/gi, (_, op, a, b) => b ? T.formed(+a, +b) : op === ">" ? T.formed(+a + 1) : op === ">=" ? T.formed(+a) : op === "<" ? T.formed(null, +a - 1) : op === "<=" ? T.formed(null, +a) : T.formed(+a, +a));
    take(/\s(?:(?:formed|founded|started|registered|opened)\s+)?(before|after|since|in|during)\s+((?:19|20)\d\d)(?=\s)/gi, (m, w, y) => /before/i.test(w) ? T.formed(null, +y - 1) : /after/i.test(w) ? T.formed(+y + 1) : /since/i.test(w) ? T.formed(+y) : T.formed(+y, +y));
    take(/\s(?:formed|founded|started|registered|opened)\s+((?:19|20)\d\d)(?=\s)/gi, (_, y) => T.formed(+y, +y));
    take(/\s(?:older than|over|more than)\s+(\d+)\s+years?(?:\s+old)?(?=\s)/gi, (_, n) => T.formed(null, YEAR - +n));
    take(/\s(?:newer than|younger than|under|less than)\s+(\d+)\s+years?(?:\s+old)?(?=\s)/gi, (_, n) => T.formed(YEAR - +n + 1));
    // contact fields
    take(/\s(?:has|with):(\w+)(?=\s)/gi, (_, f) => FIELD[f.toLowerCase()] && T.has(FIELD[f.toLowerCase()]));
    take(/\s(?:no|missing|without):(\w+)(?=\s)/gi, (_, f) => FIELD[f.toLowerCase()] && T.missing(FIELD[f.toLowerCase()]));
    take(/\s(?:no|without|missing|lacking)\s+(?:an?\s+)?(e-mail|email|phone|number|website|site|web|hours)(?=\s)/gi, (_, f) => T.missing(FIELD[f.toLowerCase()]));
    take(/\s(?:with|has|have|having)\s+(?:an?\s+)?(e-mail|email|phone|number|website|site|web|hours)(?=\s)/gi, (_, f) => T.has(FIELD[f.toLowerCase()]));
    take(/\s(?:emailable|reachable)(?=\s)/gi, () => T.has("email"));
    // outreach history
    take(/\s(?:not|never|un)[- ]?contacted(?: yet)?(?=\s)/gi, () => T.contacted(false));
    take(/\s(?:already\s+)?(?:contacted|emailed|reached)(?=\s)/gi, () => T.contacted(true));
    if (vocab.group?.length) take(new RegExp(`\\s(?:group:?|in group|from group)\\s*(${alt(vocab.group)})(?=\\s)`, "gi"), (_, g) => T.group(vocab.group.find(x => x.toLowerCase() === g.toLowerCase())));
    // registration
    take(/\s(?:inactive|closed|defunct)(?=\s)/gi, () => [T.status("suspended"), T.status("dissolved")]);
    take(/\s(active|suspended|dissolved)(?=\s)/gi, (_, w) => T.status(w.toLowerCase()));
    const typeWords = Object.keys(TYPE_WORDS).filter(w => vocab.type?.includes(TYPE_WORDS[w]));
    if (vocab.type?.length) take(new RegExp(`\\s(${alt([...vocab.type, ...typeWords, "llcs", "corporations", "corps", "inc"])})(?=\\s)`, "gi"), (_, w) => {
      const k = w.toLowerCase(); const v = vocab.type.find(x => x.toLowerCase() === k) || (typeWords.includes(k) ? TYPE_WORDS[k] : /^llc/.test(k) ? "LLC" : /^corp|^inc/.test(k) ? "Corporation" : null);
      return v && T.type(v);
    });
    // sector and place; a state only when its name isn't also a city ("new york" is the city, "new york state" the state)
    const cityNames = new Set((vocab.city || []).map(c => c.toLowerCase()));
    const states = Object.keys(STATES).filter(k => !cityNames.has(k));
    take(new RegExp(`\\s(?:(?:in|across|around|from)\\s+)?(${alt(states)})(?=\\s)`, "gi"), (_, w) => T.state(STATES[w.toLowerCase()]));
    take(new RegExp(`\\s(${alt([...(vocab.sector || []), ...Object.keys(SECTOR_WORDS)])})(?=\\s)`, "gi"), (_, w) => T.sector(SECTOR_WORDS[w.toLowerCase()] || vocab.sector.find(x => x.toLowerCase() === w.toLowerCase())));
    take(new RegExp(`\\s(?:(?:in|around|near|from)\\s+)?(${cities})(?=\\s)`, "gi"), (_, c) => T.city(cityOf(c)));
    const rest = s.replace(/[,;]/g, " ").replace(/\s+/g, " ").trim();
    return { tags, rest };
  }

  // Tags plus leftover words -> a core search. ctx supplies what only the host app knows.
  function compile(tags, rest, { centers = new Map(), me = null, lastContact = () => null, groups = () => [] } = {}) {
    const by = k => tags.filter(t => t.kind === k).map(t => t.v);
    const text = (rest || "").replace(STOP, " ").replace(/\s+/g, " ").trim();
    const filters = { sector: by("sector"), city: by("city"), state: by("state"), status: by("status"), entityType: by("type") };
    const preds = [];
    for (const [min, max] of by("staff")) preds.push(e => e.employees != null && (min == null || e.employees >= min) && (max == null || e.employees <= max));
    for (const [min, max] of by("formed")) preds.push(e => { const y = e.formed ? +e.formed.slice(0, 4) : null; return y != null && (min == null || y >= min) && (max == null || y <= max); });
    for (const f of by("has")) preds.push(e => !!e[f]);
    for (const f of by("missing")) preds.push(e => !e[f]);
    for (const yes of by("contacted")) preds.push(e => !!lastContact(e.id) === yes);
    const gs = by("group"); if (gs.length) preds.push(e => groups().some(g => gs.includes(g.name) && g.ids.includes(e.id)));
    const hay = e => [e.name, e.legalName, e.description, e.sector, e.naics, e.city, (e.tags || []).join(" ")].join(" ").toLowerCase();
    for (const p of by("phrase")) preds.push(e => hay(e).includes(p.toLowerCase()));
    for (const w of by("exclude")) preds.push(e => !new RegExp(`\\b${escRe(w.toLowerCase())}`).test(hay(e)));
    let near = null, radiusKm = null;
    const n = by("near")[0];
    if (n) { const c = n.place === "me" ? me : centers.get(n.place); if (c) { near = { lat: c.lat, lng: c.lng, label: n.place === "me" ? "Nearest to you" : `Out from central ${n.place}` }; radiusKm = n.km; } }
    return { text, filters, near, radiusKm, has: by("has"), missing: by("missing"), where: preds.length ? e => preds.every(p => p(e)) : null };
  }

  // What a half-typed word could become: entities and phrasings the parser understands.
  const TEMPLATES = ["has email", "has website", "has phone", "no email", "no website", "not contacted", "contacted", "within 25 mi of me", "near me"];
  function complete(partial, vocab = {}) {
    const p = partial.toLowerCase().trim(); if (p.length < 2) return [];
    const out = [];
    const ent = (kind, list) => { for (const v of list || []) if (v.toLowerCase().startsWith(p) || v.toLowerCase().split(/\s+/).some(w => w.startsWith(p))) out.push({ kind, v, text: v }); };
    ent("sector", vocab.sector); ent("city", vocab.city);
    for (const [k, v] of Object.entries(STATES)) if (k.startsWith(p) && !(vocab.city || []).some(c => c.toLowerCase() === k)) out.push({ kind: "state", v, text: STATE_NAME[v] }); ent("type", vocab.type); ent("group", vocab.group);
    const alias = (kind, words) => { for (const [w, v] of Object.entries(words)) if (w.startsWith(p) && !out.some(x => x.kind === kind && x.v === v)) out.push({ kind, v, text: v }); };
    alias("city", CITY_WORDS); alias("sector", SECTOR_WORDS);
    for (const c of vocab.city || []) if (("within 25 mi of " + c.toLowerCase()).startsWith(p) && p.startsWith("with")) out.push({ kind: "near", v: c, text: `within 25 mi of ${c}` });
    for (const t of TEMPLATES) if (t.startsWith(p) && t !== p) out.push({ kind: "phrase", v: t, text: t });
    return out;
  }

  return { parse, compile, complete, tag: T, STATE_NAME };
})();


/* ===================================================================
   IndexJudge: words the search doesn't know, turned into tags. No DOM code in here.
   Judgments come from TypeSafe's Jev: typed questions in, answers with probabilities out.
   The index keeps only the confident answers and turns them into the same tags the parser makes.
     const judge = IndexJudge.typesafe({ endpoint });  // your server adds the key and forwards to api.typesafe.ai/v1/systemone
     const judge = IndexJudge.standIn();               // no network: a word list that answers in Jev's shape
     const { tags, conf } = await IndexJudge.understand(judge, "coffee in the bay", vocab, IndexQuery.tag);
   The TypeSafe key never reaches the browser: the page only knows your endpoint.
   =================================================================== */
const IndexJudge = (() => {
  const MIN = 0.6; // below this probability an answer is ignored
  function questions(vocab) {
    const choice = (instructions, criteria) => ({ type: "choice", instructions, criteria });
    const opts = (list, say, none) => Object.fromEntries([...list.map(v => [v, say(v)]), ["none", none]]);
    return {
      sector: choice("Which business sector is this search looking for?", opts(vocab.sector || [], v => `${v} businesses`, "No sector is implied")),
      city: choice("Which US city is this search about?", opts((vocab.city || []).slice(0, 60), v => `In or around ${v}`, "No place, or a place not listed")),
      contact: choice("Does the searcher need a way to reach the business?", { email: "They need an email address", phone: "They need a phone number", website: "They need a website", none: "Contact details aren't mentioned" }),
      size: choice("What size of business do they want?", { small: "Small: under 10 staff", medium: "Medium: 10 to 50 staff", large: "Large: over 50 staff", any: "Size isn't mentioned" }),
    };
  }
  // POST { model, state, questions } → { answers }. Retries once or twice when Jev is busy (429, 529).
  function typesafe({ endpoint, fetchImpl = (...a) => fetch(...a) }) {
    return {
      name: "Jev", live: true,
      async ask(state, qs, { signal } = {}) {
        for (let attempt = 0; ; attempt++) {
          const res = await fetchImpl(endpoint, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ model: "jev-latest", state, questions: qs }), signal });
          if ((res.status === 429 || res.status === 529) && attempt < 2) { await new Promise(r => setTimeout(r, 500 * 2 ** attempt)); continue; }
          if (!res.ok) throw new Error(`Jev answered ${res.status}`);
          return (await res.json()).answers || {};
        }
      },
    };
  }
  // Stand-in: the same answer shape from a word list, so the interface can be built and tested before the key is added.
  const LEX = {
    sector: {
      "Food & Beverage": "coffee cafe café espresso bakery bakeries bread pastry pastries croissant eat eats food dinner lunch brunch breakfast restaurant restaurants pizza taco tacos burger burgers bar bars brewery beer wine winery deli",
      Technology: "app apps startup startups saas ai software code coding developer developers tech cloud data computer computers phone repair",
      Healthcare: "clinic clinics doctor doctors dentist dentists dental therapy therapist medical pharmacy vet vets veterinarian optician",
      "Beauty & Wellness": "hair haircut barber barbers salon salons nails spa massage tattoo beauty",
      "Real Estate": "homes housing realtor realtors rent rental rentals apartment apartments property properties",
      Retail: "shop shops store stores boutique boutiques clothes clothing gifts books bookstore florist flowers",
      Hospitality: "hotel hotels motel stay sleep hostel lodging",
      "Fitness & Recreation": "gym gyms fitness yoga workout climbing pilates",
      Automotive: "car cars auto mechanic garage tires tyres",
      Finance: "bank banks atm insurance financial",
      Education: "school lessons classes tutoring",
      "Home Services": "plumber plumbers electrician electricians locksmith contractor",
      Manufacturing: "factory factories machining fabrication makers manufacturing workshop",
      "Arts & Entertainment": "cinema movies theater theatre club nightclub gallery music",
      "Professional Services": "lawyer lawyers law legal accountant accountants accounting consultant consultants consulting agency agencies marketing architect",
    },
    city: { "San Francisco": "bay|bay area|frisco|soma|mission district", Oakland: "east bay|oakland|the town", "Long Beach": "lbc|long beach", "Los Angeles": "hollywood|socal|westside|venice|silver lake", "San Diego": "la jolla|gaslamp", "San Jose": "silicon valley|south bay", Sacramento: "capital|capitol|midtown", Fresno: "central valley" },
    contact: { email: "email emails e-mail inbox mail write", phone: "call phone ring number", website: "website site online web url" },
    size: { small: "small|tiny|little|family|mom and pop|local|indie|independent|solo", medium: "medium mid midsize mid-size growing", large: "large big biggest major enterprise corporate" },
  };
  function standIn() {
    return {
      name: "Jev stand-in", live: false,
      async ask(state, qs, { text = state } = {}) {
        const hay = " " + text.toLowerCase().replace(/[^\w&'-]+/g, " ") + " ";
        const answers = {};
        for (const [id, q] of Object.entries(qs)) {
          const options = Object.keys(q.criteria), fallback = options.includes("none") ? "none" : "any";
          const words = o => { const w = LEX[id]?.[o] || ""; return w.split(w.includes("|") ? "|" : " ").concat(o.toLowerCase()); };
          const score = o => words(o).filter(w => w && hay.includes(" " + w + " ")).length;
          const scored = options.filter(o => o !== fallback).map(o => [o, score(o)]).filter(x => x[1]).sort((a, b) => b[1] - a[1]);
          const choice = scored[0]?.[0] || fallback, top = scored.length ? (scored[0][1] > 1 ? .93 : .86) : .9;
          const probabilities = Object.fromEntries(options.map(o => [o, o === choice ? top : (1 - top) / (options.length - 1)]));
          answers[id] = { type: "choice", choice, probabilities, confidence: top };
        }
        return answers;
      },
    };
  }
  const SIZE = { small: [null, 9], medium: [10, 50], large: [51, null] };
  async function understand(judge, text, vocab, T, opts = {}) {
    const answers = await judge.ask(`Someone is searching a directory of US businesses. Their words: "${text}"`, questions(vocab), { ...opts, text });
    const tags = [], ps = [];
    const take = id => { const a = answers[id]; if (!a || a.type !== "choice") return null; const p = a.probabilities?.[a.choice] ?? a.confidence ?? 0; return p >= MIN && a.choice !== "none" && a.choice !== "any" ? (ps.push(p), a.choice) : null; };
    const sector = take("sector"), city = take("city"), contact = take("contact"), size = take("size");
    if (sector && (vocab.sector || []).includes(sector)) tags.push(T.sector(sector));
    if (city && (vocab.city || []).includes(city)) tags.push(T.city(city));
    if (contact) tags.push(T.has(contact));
    if (size && SIZE[size]) tags.push(T.staff(...SIZE[size]));
    return { tags, conf: ps.length ? Math.min(...ps) : 0, by: judge.name };
  }
  return { typesafe, standIn, understand, questions };
})();

/* ===================================================================
   IndexOSM: live businesses from OpenStreetMap's Overpass API. No DOM code in here.
   Each search asks for the businesses in one area (a city, a point and radius, or a
   state when a kind or sector narrows it) and maps them into Index records:
     core.addProvider(IndexOSM.provider({ places }));
   Data © OpenStreetMap contributors, ODbL 1.0. The public Overpass servers are shared:
   answers are cached per area, and hits while typing never start a new request.
   =================================================================== */
const IndexOSM = (() => {
  const ENDPOINTS = ["https://overpass-api.de/api/interpreter", "https://overpass.private.coffee/api/interpreter", "https://maps.mail.ru/osm/tools/overpass/api/interpreter"];
  const KEYS = ["amenity", "shop", "office", "craft", "leisure", "tourism", "healthcare"];
  const words = s => s.split(" ");
  const AMENITY = {};
  for (const [sector, vs] of Object.entries({ "Food & Beverage": "cafe restaurant fast_food bar pub ice_cream food_court biergarten", Healthcare: "dentist doctors clinic pharmacy veterinary hospital", Finance: "bank bureau_de_change", Education: "language_school driving_school music_school prep_school", "Arts & Entertainment": "cinema theatre nightclub arts_centre", Automotive: "car_wash car_rental" })) for (const v of words(vs)) AMENITY[v] = sector;
  const SHOP_FOOD = words("bakery deli butcher alcohol wine coffee tea confectionery greengrocer supermarket convenience beverages pastry cheese seafood chocolate");
  const SHOP_BEAUTY = words("hairdresser beauty cosmetics massage tattoo nails perfumery");
  const SHOP_AUTO = words("car car_repair car_parts tyres motorcycle");
  const OFFICE = { estate_agent: "Real Estate", property_management: "Real Estate" };
  for (const v of words("lawyer accountant consulting architect notary tax_advisor advertising_agency employment_agency graphic_design translator")) OFFICE[v] = "Professional Services";
  for (const v of words("insurance financial financial_advisor")) OFFICE[v] = "Finance";
  for (const v of words("it software telecommunication")) OFFICE[v] = "Technology";
  const NOT_BUSINESS = words("government diplomatic religion ngo association political_party union");
