  if (!quiet) { renderSelbar(); if (otab === "campaign") renderOutreach(); }
}
$("sel-add").onclick = () => { const g = $("sel-groups"); g.hidden = !g.hidden; if (!g.hidden) g.querySelector("input")?.focus({ preventScroll: true }); fitStage(true); };
$("sel-run").onclick = () => { camp.audience = "selected"; openOutreach("campaign"); };
$("sel-clear").onclick = () => { [...picked].forEach(id => togglePick(id, false, true)); renderSelbar(); renderOutreach(); $("sel-groups").hidden = true; };

/* outreach panel */
function openOutreach(t) {
  if (t) otab = t;
  engage();
  if (view !== "outreach") { setView("outreach"); slideInd($("out-tabs"), false); } else renderOutreach(true);
}
document.querySelectorAll("#out-tabs [data-otab]").forEach(b => b.onclick = () => {
  if (b.dataset.otab === otab) return; otab = b.dataset.otab; renderOutreach(true);
});

function row(k, v, act = "", mono = true) { return `<div class="r"><span class="kv"><span class="k">${k}</span><span${mono ? "" : ' class="plain"'}>${v}</span></span>${act ? `<span class="act">${act}</span>` : "<span></span>"}</div>`; }

function renderOutreach(animate) {
  const st = $("out-status"); if (st) st.innerHTML = running ? `<span class="lead"><span class="dot busy pulse"></span>Running</span>` : `<span class="lead"><span class="dot ${store.get("claude.key") ? "ok" : ""}"></span>${store.get("claude.key") ? "Claude agent" : "Template agent"}</span>`;
  document.querySelectorAll("#out-tabs [data-otab]").forEach(b => b.setAttribute("aria-pressed", b.dataset.otab === otab));
  slideInd($("out-tabs"), animate);
  const p = $("out-panel"), end = animate ? morph(p) : null;
  const ag = agentFor(), tr = transportFor();
  if (otab === "campaign") {
    const groups = out.groups();
    const opts = [["selected", "Selected", picked.size], ["results", "Current results", visible.length], ...groups.map(g => [g.id, g.name, g.ids.length])];
    const list = audience(), pl = out.plan(list, camp);
    p.innerHTML = `
      <div class="form"><span class="label">1 Audience</span>
        <div class="segs chips">${opts.map(([k, l, n]) => `<button class="seg" data-aud="${esc(k)}" aria-pressed="${camp.audience === k}">${esc(l)} <span class="n">${n}</span></button>`).join("")}</div></div>
      <div class="form"><span class="label">2 Rules</span><div class="rows">
        ${row("Repeats", camp.skipWithinDays ? `Skip anyone contacted in the last ${camp.skipWithinDays} days` : "Allow repeat contact", `<button data-rule="repeat">${camp.skipWithinDays ? "on" : "off"}</button>`, false)}
        ${row("Status", camp.onlyActive ? "Skip businesses registered as closed" : "Include closed registrations", `<button data-rule="active">${camp.onlyActive ? "on" : "off"}</button>`, false)}
        ${row("Email", "Businesses without an email on record are skipped", "", false)}
      </div></div>
      <div class="form"><span class="label">3 Message</span>
        <label class="field-row"><span class="muted">Name</span><input id="c-name" class="plain-in" value="${esc(camp.name)}" placeholder="Campaign name"></label>
        <textarea id="c-brief" class="area" rows="7" aria-label="Brief">${esc(camp.brief)}</textarea>
        <p class="muted">${ag.name === "Claude" ? "Your Claude agent reads this brief and each business record, then writes one email per business." : "No Claude key yet, so {name}, {city}, {sector} and {owner} are filled in from each record. Add a Claude key under Settings to have Claude write each email."}</p></div>
      <div class="stats"><div><span class="muted">Will contact</span><span>${pl.send.length}</span></div><div><span class="muted">Skipped</span><span>${pl.skip.length}</span></div><div><span class="muted">Delivery</span><span class="trunc">${tr.name === "Webhook" ? "Mail service" : "Drafts only"}</span></div></div>
      ${pl.skip.length ? `<div class="form"><div class="rows">${pl.skip.slice(0, 6).map(s => row(esc(s.entity.name), `<span class="muted">${esc(s.reason)}</span>`, "", false)).join("")}${pl.skip.length > 6 ? row("", `<span class="muted">and ${pl.skip.length - 6} more</span>`, "", false) : ""}</div></div>` : ""}
      <div class="acts"><button class="btn" id="c-run" ${pl.send.length && !running ? "" : "disabled"}>${running ? "Running…" : `Run for ${pl.send.length}`}</button>${running ? `<button class="btn" id="c-stop">Stop</button>` : ""}</div>`;
    p.querySelectorAll("[data-aud]").forEach(b => b.onclick = () => { camp.audience = b.dataset.aud; renderOutreach(); });
    p.querySelector('[data-rule="repeat"]').onclick = () => { camp.skipWithinDays = camp.skipWithinDays ? 0 : 30; renderOutreach(); };
    p.querySelector('[data-rule="active"]').onclick = () => { camp.onlyActive = !camp.onlyActive; renderOutreach(); };
    $("c-name").oninput = ev => camp.name = ev.target.value;
    $("c-brief").oninput = ev => camp.brief = ev.target.value;
    $("c-run").onclick = runCampaign;
    if ($("c-stop")) $("c-stop").onclick = () => running?.abort();
  }
  if (otab === "groups") {
    const groups = out.groups();
    p.innerHTML = `<p class="muted">Pick businesses in the index, then use Add to group just above the search. Groups keep their members across searches.</p>
      ${groups.length ? `<div class="form"><div class="rows">${groups.map(g => row(esc(g.name), `${g.ids.length} <span class="muted plain">${g.ids.slice(0, 3).map(id => esc(allById.get(id)?.name || "")).join(", ")}${g.ids.length > 3 ? "…" : ""}</span>`,
        `<button data-use="${esc(g.id)}">campaign</button> <button data-pickg="${esc(g.id)}">select</button> <button data-del="${esc(g.id)}">delete</button>`, true)).join("")}</div></div>` : `<p class="muted">No groups yet.</p>`}`;
    p.querySelectorAll("[data-use]").forEach(b => b.onclick = () => { camp.audience = b.dataset.use; otab = "campaign"; renderOutreach(true); });
    p.querySelectorAll("[data-pickg]").forEach(b => b.onclick = () => { out.groups().find(g => g.id === b.dataset.pickg).ids.forEach(id => togglePick(id, true)); });
    p.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { out.deleteGroup(b.dataset.del); if (camp.audience === b.dataset.del) camp.audience = "selected"; renderOutreach(); renderSelbar(); });
  }
  if (otab === "activity") {
    const log = out.log(), reached = new Set(log.filter(x => x.status !== "failed").map(x => x.entityId)).size;
    p.innerHTML = `<div class="stats"><div><span class="muted">Reached</span><span>${reached}</span></div><div><span class="muted">Groups</span><span>${out.groups().length}</span></div><div><span class="muted">Campaigns</span><span>${out.campaigns().length}</span></div></div>
      <div id="report"></div>` + (log.length ? `<div class="form"><div class="rows">${log.slice(0, 50).map(x => row(`<span class="dot ${x.status === "failed" ? "error" : "ok"}"></span> ${ago(x.at)}`, `${esc(x.name)} <span class="muted plain">${esc(x.campaign)} · ${esc(x.status)}${x.error ? " · " + esc(x.error) : ""}</span>`, "", true)).join("")}</div></div>
      <p class="muted">Every campaign writes here. Campaigns skip anyone contacted recently, so no one hears from you twice by accident.</p>` : `<p class="muted">Nothing sent yet. Select businesses in the list, then start a campaign. Its progress shows here live, and every business it reaches is logged.</p>`);
    if (lastRun) renderReport();
  }
  if (otab === "settings") {
    const key = store.get("claude.key"), ju = store.get("jev.endpoint");
    const su = store.get("index.server") || "";
    const srcLine = source?.kind === "server" ? `<span class="dot ok"></span>${(source.count || 0).toLocaleString()} businesses from the search server`
      : source?.error ? `<span class="dot error"></span>${esc(source.error)}. Using the built-in California cities.` : `<span class="dot"></span>Built-in: eight California cities`;
    p.innerHTML = `
      <div class="form"><span class="label">Records: search server</span>
        <p class="muted">The all-US index lives on a search server, because it's too big for one page. Opened from the server, Index uses it without asking. Anywhere else, paste its address here.</p>
        <div class="fields">
          <label class="field-row"><span class="muted">Server</span><input id="srv-url" class="plain-in" type="url" placeholder="https://your-index-server" value="${esc(su)}"></label>
        </div>
        <div class="acts"><button class="btn" id="srv-save">Save and reload</button>${su ? `<button class="btn" id="srv-clear">Remove</button>` : ""}<span class="muted lead" id="srv-msg" role="status">${srcLine}</span></div>
      </div>
      <div class="form"><span class="label">Search understanding: Jev</span>
        <p class="muted">Jev, from TypeSafe, reads the words the search doesn't know, like “coffee in the bay”, and turns them into tags with how sure it is. Your TypeSafe key stays on your own server: give Index an endpoint there that adds the key and forwards the request to api.typesafe.ai/v1/systemone. Until then a stand-in answers in the same shape.</p>
        <div class="fields">
          <label class="field-row"><span class="muted">Endpoint</span><input id="jev-url" class="plain-in" type="url" placeholder="https://your-server/jev" value="${esc(ju || "")}"></label>
        </div>
        <div class="acts"><button class="btn" id="jev-save">Save</button><button class="btn" id="jev-test">Test</button>${ju ? `<button class="btn" id="jev-clear">Remove</button>` : ""}<span class="muted lead" id="jev-msg" role="status"><span class="dot ${{ saved: "busy", ok: "ok", error: "error" }[jevStatus] || ""}"></span>${{ "stand-in": "Stand-in answering", saved: "Endpoint saved", ok: "Connected", error: "Unreachable" }[jevStatus]}</span></div>
      </div>
      <div class="form"><span class="label">Agent: Claude</span>
      <p class="muted">Bring your own agent. With a Claude API key, Claude writes each email from your brief and the business record. Keys stay in this browser.</p>
      <div class="fields">
        <label class="field-row"><span class="muted">Claude key</span><input id="a-key" class="plain-in" type="password" autocomplete="off" placeholder="sk-ant-…" value="${key ? "••••••••" + esc(key.slice(-4)) : ""}"></label>
        <label class="field-row"><span class="muted">Model</span><span class="mono">claude-opus-5-5</span></label>
        <label class="field-row"><span class="muted">Sign as</span><input id="a-sender" class="plain-in" placeholder="Your name and business" value="${esc(store.get("agent.sender") || "")}"></label>
        <label class="field-row"><span class="muted">Mail hook</span><input id="a-hook" class="plain-in" type="url" placeholder="https://… (optional)" value="${esc(store.get("mail.webhook") || "")}"></label>
      </div>
      <textarea id="a-instr" class="area" rows="4" aria-label="Agent instructions" placeholder="Standing instructions for your agent, e.g. tone, what to offer, what never to say">${esc(store.get("agent.instructions") || "")}</textarea>
      <p class="muted">Without a mail hook, campaigns save drafts to the log. Add a hook from your mail service (Resend, Postmark, a Zapier or Make webhook) to send for real.</p>
      <div class="acts"><button class="btn" id="a-save">Save</button><button class="btn" id="a-test">Test agent</button>${key ? `<button class="btn" id="a-clear">Remove key</button>` : ""}<span class="muted" id="a-msg" role="status"></span></div></div>`;
    $("srv-save").onclick = () => {
      const u = $("srv-url").value.trim();
      if (!/^https?:\/\//.test(u)) { $("srv-msg").textContent = "Enter the server's address, starting with https://"; return; }
      store.set("index.server", u); location.reload();
    };
    if ($("srv-clear")) $("srv-clear").onclick = () => { store.set("index.server", null); location.reload(); };
    $("jev-save").onclick = () => {
      const u = $("jev-url").value.trim(), msg = $("jev-msg");
      if (!/^https:\/\//.test(u)) { msg.textContent = "Enter your endpoint, starting with https://"; return; }
      store.set("jev.endpoint", u); jevStatus = "saved"; jevCache.clear(); renderOutreach();
    };
    if ($("jev-clear")) $("jev-clear").onclick = () => { store.set("jev.endpoint", null); jevStatus = "stand-in"; jevCache.clear(); renderOutreach(); };
    $("jev-test").onclick = async () => {
      const msg = $("jev-msg"), live = !!store.get("jev.endpoint"), probe = "coffee in the bay with email";
      msg.textContent = live ? "Asking Jev…" : "Asking the stand-in…";
      try {
        const r = await IndexJudge.understand(judge(), probe, qvocab(), IndexQuery.tag);
        jevStatus = live ? "ok" : "stand-in"; renderOutreach();
        $("jev-msg").textContent = `${live ? "Jev" : "The stand-in"} read “${probe}” as ${r.tags.map(t => t.label).join(", ") || "nothing it knows"}.`;
      } catch (err) {
        jevStatus = "error"; renderOutreach();
        $("jev-msg").textContent = `Your endpoint couldn't be reached from this preview (${err.message}). Outside calls are blocked here; the same code works once hosted.`;
      }
    };
    $("a-save").onclick = () => {
      const k = $("a-key").value.trim(), h = $("a-hook").value.trim();
      if (k && !k.startsWith("••••")) store.set("claude.key", k);
      if (h && !/^https:\/\//.test(h)) { $("a-msg").textContent = "The mail hook must start with https://"; return; }
      store.set("mail.webhook", h || null); store.set("agent.sender", $("a-sender").value.trim() || null); store.set("agent.instructions", $("a-instr").value.trim() || null);
      renderOutreach(); $("a-msg").textContent = "Saved in this browser.";
    };
    if ($("a-clear")) $("a-clear").onclick = () => { store.set("claude.key", null); renderOutreach(); };
    $("a-test").onclick = async () => {
      const m = $("a-msg"); m.textContent = "Asking the agent for a sample…";
      try { const d = await agentFor().draft(visible[0] || [...allById.values()][0], camp.brief); m.textContent = `Works. Sample subject: “${d.subject}”`; }
      catch (err) { m.textContent = `The agent couldn't be reached from this preview (${err.message}). Outside calls are blocked here; the same code works once the app is hosted.`; }
    };
  }
  end?.();
}


/* live report */
function renderReport() {
  const r = $("report"); if (!r || !lastRun) return;
  const c = lastRun.counts, pct = c.total ? Math.round(c.done / c.total * 100) : 100;
  r.innerHTML = `<div class="form"><span class="label" style="display:flex;justify-content:space-between"><span>Live report</span><span class="mono" style="text-transform:none">${c.done} / ${c.total}</span></span>
    <div class="meter" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
    <div class="stats four"><div><span class="muted">${lastRun.transport === "Webhook" ? "Sent" : "Drafted"}</span><span>${c.sent + c.drafted}</span></div><div><span class="muted">Writing</span><span>${lastRun.rows.filter(x => x.state === "drafting").length}</span></div><div><span class="muted">Failed</span><span>${c.failed}</span></div><div><span class="muted">Skipped</span><span>${c.skipped}</span></div></div>
    <div class="rows">${lastRun.rows.map((x, i) => `<button class="r runrow" data-i="${i}" aria-expanded="${!!x.open}"><span class="kv"><span class="k"><span class="dot ${x.state === "drafting" ? "busy pulse" : x.state === "failed" ? "error" : x.state === "skipped" ? "" : x.state === "queued" ? "" : "ok"}"></span> ${esc(x.state)}</span><span class="trunc">${esc(x.entity.name)}${x.note ? ` <span class="muted plain">${esc(x.note)}</span>` : ""}</span></span><span></span></button>${x.open && x.entry?.body ? `<div class="draft"><span class="mono">${esc(x.entry.subject)}</span>\n\n${esc(x.entry.body)}</div>` : ""}`).join("")}</div></div>`;
  r.querySelectorAll(".runrow").forEach(b => b.onclick = () => { const x = lastRun.rows[+b.dataset.i], end = morph(r); x.open = !x.open; renderReport(); end(); });
}

async function runCampaign() {
  const list = audience();
  const ctl = new AbortController(); running = ctl;
  lastRun = { counts: { total: 0, done: 0, sent: 0, drafted: 0, failed: 0, skipped: 0 }, rows: [], transport: transportFor().name };
  const rowOf = e => lastRun.rows.find(x => x.entity.id === e.id);
  otab = "activity"; renderOutreach(true);
  await out.run({ name: camp.name || `Campaign ${out.campaigns().length + 1}`, brief: camp.brief }, list, {
    agent: agentFor(), transport: transportFor(), rules: camp, signal: ctl.signal,
    onEvent(ev) {
      if (ev.type === "planned") { lastRun.rows = [...ev.send.map(e => ({ entity: e, state: "queued" }))]; lastRun.counts.total = ev.send.length; }
      else if (ev.type === "skipped") { lastRun.rows.push({ entity: ev.entity, state: "skipped", note: ev.reason }); lastRun.counts.skipped++; }
      else if (ev.type === "drafting") rowOf(ev.entity).state = "drafting";
      else if (ev.type === "sent" || ev.type === "drafted") Object.assign(rowOf(ev.entity), { state: ev.type, entry: ev.entry });
      else if (ev.type === "failed") Object.assign(rowOf(ev.entity), { state: "failed", note: ev.error });
      else if (ev.type === "progress") Object.assign(lastRun.counts, ev.counts);
      renderReport();
    },
  });
  running = null; renderOutreach(); refreshContacted();
}

// Rows and records show who has already been contacted.
function refreshContacted() {
  // Only rows with a contact carry a tag, so walk the log, not the whole list.
  document.querySelectorAll("#list .nmw .tag").forEach(t => t.remove());
  new Set(out.log().map(x => x.entityId)).forEach(id => {
    const last = out.lastContact(id), cell = itemEl(id)?.querySelector(".nmw");
    if (cell && last) cell.insertAdjacentHTML("beforeend", `<span class="tag" title="${last.status === "sent" ? "Emailed" : "Draft written"} ${ago(last.at)}">✉ ${ago(last.at)}</span>`);
  });
  if (current && tab === "outreach") fillTab(false);
}
renderOutreach();
slideInd($("mode"), false); slideInd($("sort"), false);
document.body.classList.add("idle"); syncBar();
// Place words, sectors and city centres come from the source: the server's summary, or the built-in records.
async function connect() {
  const url = serverUrl();
  if (url) {
    const remote = IndexCore.providers.remote(url);
    try {
      const v = await remote.vocab();
      core.addProvider(remote);
      vocab.sector = v.sectors; vocab.type = v.types; vocab.city = v.cities.map(c => c[0]).filter(Boolean);
      for (const [c, , , lat, lng] of v.cities) cityCenters.set(c, { lat, lng });
      source = { kind: "server", url: remote.endpoint, count: v.count, built: v.built };
      return;
    } catch (err) { source = { kind: "built-in", error: `${url} couldn't be reached (${err.message})` }; }
  }
  // Live: every search asks OpenStreetMap for the area it names. A Claude preview can't reach outside
  // servers, so there the page falls back to the eight California cities built in below.
  if (new URLSearchParams(location.search).get("source") !== "built-in") {
    const only = new URLSearchParams(location.search).get("overpass"); // ?overpass=URL pins one Overpass server
    // The site loads the city list as its own file after the page is up; the Claude preview carries it inline.
    if (!PLACES) try { PLACES = await (await fetch("places.json")).json(); } catch { PLACES = { cities: [], types: [] }; }
    const osm = IndexOSM.provider({ places: PLACES.cities, fallbackPlace: store.get("index.place") || "San Francisco", ...(only ? { endpoints: [only] } : {}) });
    if (only || !DATA.records.length || await osm.reachable()) { // the site build carries no sample, so it never waits on a probe
      core.addProvider(osm); live = osm;
      vocab.sector = ["Food & Beverage", "Retail", "Healthcare", "Beauty & Wellness", "Professional Services", "Finance", "Real Estate", "Technology", "Hospitality", "Fitness & Recreation", "Education", "Automotive", "Home Services", "Manufacturing", "Arts & Entertainment"];
      vocab.type = PLACES.types; vocab.city = PLACES.cities.map(c => c[0]);
      for (const [c, , lat, lng] of PLACES.cities) cityCenters.set(c, { lat, lng });
      source = { kind: "live" };
      return;
    }
    source = { kind: "built-in", error: "OpenStreetMap can't be reached from here" };
  }
  core.addProvider(IndexCore.providers.static(DATA.records, "OpenStreetMap"));
  const r = await core.search({ limit: 5000 });
  vocab.sector = r.facets.sector.map(([k]) => k); vocab.city = r.facets.city.map(([k]) => k); vocab.type = [...new Set(r.items.map(e => e.entityType).filter(Boolean))];
  // Each city's centre is the average of its businesses, so a city filter can order the list outward from it.
  const acc = new Map();
  for (const e of r.items) if (e.city && e.lat != null) { const a = acc.get(e.city) || { lat: 0, lng: 0, n: 0 }; a.lat += e.lat; a.lng += e.lng; a.n++; acc.set(e.city, a); }
  for (const [c, a] of acc) cityCenters.set(c, { lat: a.lat / a.n, lng: a.lng / a.n });
  source = { ...(source || {}), kind: "built-in", count: r.total };
}
connect().then(() => { startHint(); run(); });
